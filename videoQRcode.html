<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>视频播放</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #000;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .video-wrap {
      width: 100%;
      max-width: 960px;
      aspect-ratio: 16 / 9;
      background: #111;
    }
    video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      background: #000;
    }
    .hint {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.35);
      font-size: 12px;
      font-family: system-ui, sans-serif;
      text-align: center;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="video-wrap">
    <video
      id="mainVideo"
      controls
      playsinline
      webkit-playsinline
      x5-playsinline
      preload="metadata"
    >
      <source
        src="https://github.com/Long-wang196/wemapvideo/releases/download/v1/demo.mp4"
        type="video/mp4"
      >
      你的浏览器不支持视频播放，请更换浏览器或更新系统。
    </video>
  </div>
  <p class="hint">轻触视频即可播放</p>

  <script>
    const video = document.getElementById('mainVideo');
    video.addEventListener('click', () => {
      if (video.paused) {
        video.play().catch(() => {});
      }
    });
  </script>
</body>
</html>
